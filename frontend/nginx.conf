# AYCO Frontend — Grupo Salinas
# nginx config for ayco-web ECS
# Copy to /etc/nginx/conf.d/ayco.conf

# Upstream: Dify API (internal ECS IP)
upstream dify_backend {
    server ${DIFY_ECS_IP:?FATAL: DIFY_ECS_IP no definida}:80;
}

server {
    listen 80;
    server_name _;

    # Frontend static files
    root /var/www/ayco;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # AYCO API backend (FastAPI on port 8001)
    # Upload, status, DWS queries, health
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 20M;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Dify API reverse proxy (avoids CORS, hides backend IP)
    location /api/dify/ {
        proxy_pass http://dify_backend/v1/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;

        # SSE support for streaming responses
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;

        # CORS headers (fallback)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Static assets with long cache
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
