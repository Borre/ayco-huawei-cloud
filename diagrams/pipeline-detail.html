<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AYCO Pipeline Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0a; padding: 1.5rem; color: white; }
    .container { max-width: 1280px; margin: 0 auto; }
    .header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; }
    .pulse-dot { width: 10px; height: 10px; background: #E4002B; border-radius: 50%; }
    h1 { font-size: 1.2rem; font-weight: 700; }
    .subtitle { color: #888; font-size: 0.8rem; margin-left: 1.5rem; }
    .diagram-container { background: #111; border-radius: 0.75rem; border: 1px solid #222; padding: 1.25rem; overflow-x: auto; margin-top: 1rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row"><div class="pulse-dot"></div><h1>AYCO Pipeline Detail — Contract → Risk → Dashboard</h1></div>
    <p class="subtitle">20 seed contracts · End-to-end data flow · 3 integrated demos</p>
    <div class="diagram-container">

        <rect x="45" y="270" width="110" height="45" rx="4" fill="#1a0a0a" stroke="#E4002B" stroke-width="0.75"/>

        <text x="100" y="305" fill="#999" font-size="8" text-anchor="middle">Ingest channels</text>
        <rect x="45" y="330" width="110" height="45" rx="4" fill="#1a0a0a" stroke="#E4002B" stroke-width="0.75"/>
        <text x="100" y="350" fill="#E4002B" font-size="8" text-anchor="middle">generate-contract-data.py</text>
        <text x="100" y="365" fill="#999" font-size="8" text-anchor="middle">Seed data generator</text>

        <!-- Arrow 1→2 -->
        <line x1="170" y1="250" x2="248" y2="250" stroke="#E4002B" stroke-width="2" marker-end="url(#r)"/>

        <!-- Step 2 -->
        <rect x="250" y="100" width="140" height="300" rx="8" fill="#111" stroke="#34d399" stroke-width="1.5"/>

        <rect x="265" y="150" width="110" height="55" rx="4" fill="#0a1a0a" stroke="#34d399" stroke-width="0.75"/>
        <text x="320" y="170" fill="#34d399" font-size="8" text-anchor="middle">ayco-ocr-trigger</text>
        <text x="320" y="185" fill="#999" font-size="8" text-anchor="middle">Huawei OCR API</text>
        <text x="320" y="198" fill="#999" font-size="8" text-anchor="middle">~4,500 chars</text>
        <rect x="265" y="220" width="110" height="55" rx="4" fill="#0a1a0a" stroke="#34d399" stroke-width="0.75"/>
        <text x="320" y="240" fill="#34d399" font-size="8" text-anchor="middle">ayco-parse-contract</text>
        <text x="320" y="255" fill="#999" font-size="8" text-anchor="middle">Regex extraction</text>
        <text x="320" y="268" fill="#999" font-size="8" text-anchor="middle">monto, penalización...</text>
        <rect x="265" y="290" width="110" height="55" rx="4" fill="#0a1a0a" stroke="#34d399" stroke-width="0.75"/>

        <!-- Arrow 2→3 -->

        <!-- Step 3 -->
        <rect x="470" y="100" width="140" height="300" rx="8" fill="#111" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="540" y="135" fill="white" font-size="10" font-weight="600" text-anchor="middle">3. STORE</text>
        <rect x="485" y="150" width="110" height="55" rx="4" fill="#1a0a2a" stroke="#a78bfa" stroke-width="0.75"/>
        <text x="540" y="170" fill="#a78bfa" font-size="8" text-anchor="middle">OBS Buckets</text>
        <text x="540" y="185" fill="#999" font-size="8" text-anchor="middle">raw / text / results</text>
        <text x="540" y="198" fill="#999" font-size="8" text-anchor="middle">AES-256 + KMS</text>
        <rect x="485" y="220" width="110" height="55" rx="4" fill="#1a0a2a" stroke="#a78bfa" stroke-width="0.75"/>
        <text x="540" y="240" fill="#a78bfa" font-size="8" text-anchor="middle">DWS (GaussDB)</text>
        <text x="540" y="255" fill="#999" font-size="8" text-anchor="middle">risk_results</text>
        <text x="540" y="268" fill="#999" font-size="8" text-anchor="middle">20 rows · 4 levels</text>
        <rect x="485" y="290" width="110" height="55" rx="4" fill="#1a0a2a" stroke="#a78bfa" stroke-width="0.75"/>
        <text x="540" y="310" fill="#a78bfa" font-size="8" text-anchor="middle">DLI Spark</text>
        <text x="540" y="325" fill="#999" font-size="8" text-anchor="middle">Aggregation jobs</text>
        <text x="540" y="338" fill="#999" font-size="8" text-anchor="middle">Vendor exposure</text>

        <!-- Arrow 3→4 -->
        <line x1="610" y1="250" x2="688" y2="250" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>

        <!-- Step 4 -->
        <rect x="690" y="100" width="140" height="300" rx="8" fill="#111" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="760" y="135" fill="white" font-size="10" font-weight="600" text-anchor="middle">4. VISUALIZE</text>
        <rect x="705" y="150" width="110" height="85" rx="4" fill="#0a1a2a" stroke="#22d3ee" stroke-width="0.75"/>
        <text x="760" y="175" fill="#22d3ee" font-size="8" text-anchor="middle">Streamlit</text>
        <text x="760" y="190" fill="#999" font-size="8" text-anchor="middle">Risk Dashboard</text>
        <text x="760" y="205" fill="#999" font-size="8" text-anchor="middle">KPIs · Gauge · Map</text>

        <text x="760" y="340" fill="#22d3ee" font-size="8" text-anchor="middle">Dify Chatbot</text>
        <text x="760" y="355" fill="#999" font-size="8" text-anchor="middle">RAG + Q&A</text>
        <text x="760" y="368" fill="#999" font-size="8" text-anchor="middle">Contract queries</text>

        <!-- Arrow 4→5 -->
        <line x1="830" y1="250" x2="908" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>

        <!-- Step 5 -->
        <rect x="910" y="100" width="340" height="300" rx="8" fill="#111" stroke="#FF9800" stroke-width="1.5"/>
        <text x="1080" y="135" fill="white" font-size="10" font-weight="600" text-anchor="middle">5. GOVERNANCE + OBSERVABILITY</text>

        <!-- DataArts -->
        <rect x="925" y="150" width="150" height="120" rx="4" fill="#1a1a0a" stroke="#FF9800" stroke-width="0.75"/>
        <text x="1000" y="175" fill="#FF9800" font-size="9" font-weight="600" text-anchor="middle">DataArts Studio</text>
        <text x="940" y="195" fill="#999" font-size="8">▸ Catalog — Lineage</text>
        <text x="940" y="212" fill="#999" font-size="8">▸ Architecture — Model</text>
        <text x="940" y="229" fill="#999" font-size="8">▸ Security — Masking</text>
        <text x="940" y="246" fill="#999" font-size="8">▸ Factory — ETL Pipeline</text>
        <text x="940" y="263" fill="#999" font-size="8">▸ DataService — API</text>

        <!-- Langfuse -->
        <rect x="1090" y="150" width="150" height="120" rx="4" fill="#1a1a0a" stroke="#a78bfa" stroke-width="0.75"/>
        <text x="1165" y="175" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">Langfuse Cloud</text>
        <text x="1105" y="195" fill="#999" font-size="8">▸ Traces (20 contracts)</text>
        <text x="1105" y="212" fill="#999" font-size="8">▸ Latency: 200-500ms</text>
        <text x="1105" y="229" fill="#999" font-size="8">▸ Tokens · Cost tracking</text>
        <text x="1105" y="246" fill="#999" font-size="8">▸ Error rate monitoring</text>
        <text x="1105" y="263" fill="#999" font-size="8">▸ Non-blocking sidecar</text>

        <!-- Security -->
        <rect x="925" y="285" width="150" height="90" rx="4" fill="#1a0a0a" stroke="#fb7185" stroke-width="0.75"/>

        <text x="940" y="330" fill="#999" font-size="8">▸ VPC Isolation</text>
        <text x="940" y="347" fill="#999" font-size="8">▸ IAM RBAC</text>
        <text x="940" y="364" fill="#999" font-size="8">▸ KMS AES-256</text>

        <rect x="1090" y="285" width="150" height="90" rx="4" fill="#1a0a0a" stroke="#fb7185" stroke-width="0.75"/>
        <text x="1165" y="310" fill="#fb7185" font-size="9" font-weight="600" text-anchor="middle">CNBV Compliance</text>
        <text x="1105" y="330" fill="#999" font-size="8">▸ AML / KYC controls</text>
        <text x="1105" y="347" fill="#999" font-size="8">▸ Data classification</text>
        <text x="1105" y="364" fill="#999" font-size="8">▸ Audit trail</text>

        <!-- Flow labels -->
        <text x="210" y="240" fill="#E4002B" font-size="8">upload</text>
        <text x="430" y="240" fill="#34d399" font-size="8">process</text>
        <text x="650" y="240" fill="#a78bfa" font-size="8">store</text>
        <text x="870" y="240" fill="#22d3ee" font-size="8">serve</text>

        <!-- Metrics banner -->
        <rect x="30" y="420" width="1220" height="55" rx="6" fill="#0f0f0f" stroke="#333" stroke-width="0.75"/>
        <text x="140" y="448" fill="#E4002B" font-size="12" font-weight="700" text-anchor="middle">20</text>
        <text x="140" y="464" fill="#999" font-size="9" text-anchor="middle">contracts</text>
        <text x="300" y="448" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">8 min</text>
        <text x="300" y="464" fill="#999" font-size="9" text-anchor="middle">vs 2 semanas</text>
        <text x="470" y="448" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">4</text>
        <text x="470" y="464" fill="#999" font-size="9" text-anchor="middle">risk levels</text>
        <text x="640" y="448" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">$133M</text>
        <text x="640" y="464" fill="#999" font-size="9" text-anchor="middle">MXN exposure</text>
        <text x="810" y="448" fill="#FF9800" font-size="12" font-weight="700" text-anchor="middle">$0.0001</text>
        <text x="810" y="464" fill="#999" font-size="9" text-anchor="middle">per contract</text>
        <text x="980" y="448" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">200ms</text>
        <text x="980" y="464" fill="#999" font-size="9" text-anchor="middle">avg latency</text>
        <text x="1150" y="448" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">6</text>
        <text x="1150" y="464" fill="#999" font-size="9" text-anchor="middle">dimensions</text>
      </svg>
    </div>
  </div>
</body>
</html>
